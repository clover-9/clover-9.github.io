name = "shortlink"
main = "_worker.js"
compatibility_date = "2026-11-15"

# KV：短码表。先建命名空间再把 id 填进来
#   npx wrangler kv namespace create LINKS
# 输出里会给你 id，粘贴到下面；本地调试用 preview_id
# [[kv_namespaces]]
# binding = "LINKS"
# id = "PASTE_KV_NAMESPACE_ID"

# 自定义域：在 Workers → Triggers → Custom Domains 里绑 s.你的域名.com
# 也可以在这里声明（需要域名已经在同一 Cloudflare 账号下）
# routes = [
#   { pattern = "s.你的域名.com/*", custom_domain = true }
# ]

[observability]
enabled = true
