name = "shortlink"
main = "_worker.js"
compatibility_date = "2026-11-15"

# KV：短码表。先建命名空间再把 id 填进来
#   npx wrangler kv namespace create LINKS
# 输出里会给你 id，粘贴到下面；本地调试用 preview_id
[[kv_namespaces]]
binding = "LINKS"
id = "1b7f853a7519412f8fa9dc94f727c9c3"

# 自定义域：绑好后短链就是 https://s.<你的域名>/*
# 买了域名之后把下面三行取消注释、改成实际域名，再 npx wrangler deploy 即可自动签发证书
# （或者直接跑 scripts\bind-domain.ps1 -Domain <你的域名>，它连 Pages 域名和 SSL 一起配好）
# routes = [
#   { pattern = "s.vktxy.top/*", custom_domain = true }
# ]

[observability]
enabled = true
